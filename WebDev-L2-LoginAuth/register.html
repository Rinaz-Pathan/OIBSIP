<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <main class="card">
    <h1>Create Account</h1>
    <p class="subtitle">It only takes a minute</p>

    <form id="register-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Create a password" required>
      <small class="hint">At least 8 characters, including 1 number</small>

      <p id="message" class="message"></p>
      <button type="submit" class="btn-main">Register</button>
    </form>

    <p class="switch">Already have an account? <a href="index.html">Login</a></p>
  </main>

  <script src="auth.js"></script>
  <script src="register.js"></script>
</body>
</html>
